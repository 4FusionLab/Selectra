name: Bug report
description: A problem with selection, the interface, or installation
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Reports in English or Russian are welcome. Include the command, examples, and result so we can reproduce the problem. For vulnerabilities, use the private channel in SECURITY.md."
  - type: input
    id: versions
    attributes:
      label: Versions and operating system
      description: Full Fusion version, Selectra version or commit, and operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the command, selected examples, search scope, and settings
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Which edges or faces should be selected?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Which elements are missing or unwanted? Is the selection preserved after confirming?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example and evidence
      description: A minimal model, screenshots, and logs without personal information. Share only files you are allowed to publish.
