name: Selection scenario
description: Suggest a task for Selectra to support
title: "[Selection]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Suggestions in English or Russian are welcome."
  - type: textarea
    id: task
    attributes:
      label: What do you want to select, and why?
      description: Describe the task, such as selecting all fillets of one radius
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Which example would you choose?
      description: An edge, face, or group; specify the search scope and whether chains may cross bodies
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What should match, and what should be excluded?
      description: Describe wanted results and similar-looking elements to exclude. How could another example refine the intent?
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model or illustration
      description: Share only material you are allowed to publish
