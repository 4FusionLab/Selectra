name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  version:
    name: Resolve GitVersion release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve GitVersion (shared platform)
        id: gitversion
        uses: 4FusionLab/.github/.github/actions/resolve-version@ad9d60ba4aabc494b4f2c85d6c566a50ca423751

  changes:
    name: Check runtime changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.impact.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect runtime changes (shared platform)
        id: impact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: 4FusionLab/.github/.github/actions/runtime-changes@2e961620a068c3ad754f6e1be05fb6e4ac68e843
        with:
          before: ${{ github.event.before }}
          after: ${{ github.sha }}
          paths-file: .github/release-paths.txt
          recover-unpublished: 'true'
          token: ${{ github.token }}

  check:
    needs: version
    name: Python checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Compile Python sources
        run: python -m compileall -q Selectra scripts tests
      - name: Test matching and packaging
        run: python -m unittest discover -s tests -v
      - name: Check public metadata and documents
        run: python scripts/check_project.py
      - name: Build release ZIP and checksum
        run: python scripts/build.py --version "${{ needs.version.outputs.version }}"
      - name: Verify Fusion ZIP using shared contract (PR dry-run)
        uses: 4FusionLab/.github/.github/actions/verify-archive@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          product: Selectra
          version: ${{ needs.version.outputs.version }}
          archives: dist/Selectra-${{ needs.version.outputs.version }}.zip
          manifest: Selectra/Selectra.manifest
      - name: Upload checked release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Selectra-package-${{ runner.os }}
          path: dist/Selectra-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish stable release from CI packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true'
    needs: [version, check, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Selectra-package-*
          path: dist/ci
      - name: Generate release notes (shared platform)
        uses: 4FusionLab/.github/.github/actions/release-notes@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          product: Selectra
          version: ${{ needs.version.outputs.version }}
          candidate: docs/releases/${{ needs.version.outputs.version }}.md
          output: ${{ runner.temp }}/release-notes.md
      - name: Verify all platform packages and calculated version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          python scripts/release_contract.py --version "$RELEASE_VERSION" --tag "$tag" \
            --channel stable --manifest Selectra/Selectra.manifest \
            --archive "dist/ci/Selectra-package-Linux/Selectra-$RELEASE_VERSION.zip" \
            --archive "dist/ci/Selectra-package-macOS/Selectra-$RELEASE_VERSION.zip" \
            --archive "dist/ci/Selectra-package-Windows/Selectra-$RELEASE_VERSION.zip" \
            --notes "$RUNNER_TEMP/release-notes.md"
      - name: Verify all CI ZIPs and manifests (shared platform)
        uses: 4FusionLab/.github/.github/actions/verify-archive@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          product: Selectra
          version: ${{ needs.version.outputs.version }}
          archives: |
            dist/ci/Selectra-package-Linux/Selectra-${{ needs.version.outputs.version }}.zip
            dist/ci/Selectra-package-macOS/Selectra-${{ needs.version.outputs.version }}.zip
            dist/ci/Selectra-package-Windows/Selectra-${{ needs.version.outputs.version }}.zip
          manifest: Selectra/Selectra.manifest
          notes: ${{ runner.temp }}/release-notes.md
      - name: Publish validated release
        env:
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          GITHUB_TOKEN: ${{ github.token }}
          GITVERSION_VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/publish_release.py --artifacts dist/ci
