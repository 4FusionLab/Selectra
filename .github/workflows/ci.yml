name: CI

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve GitVersion release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate GitVersion
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install GitVersion.Tool --tool-path "$RUNNER_TEMP/gitversion" --version 6.8.2
          version="$("$RUNNER_TEMP/gitversion/dotnet-gitversion" /showvariable MajorMinorPatch)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && \
             [[ ! "$GITHUB_REF_NAME" =~ ^v${version}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag does not match GitVersion MajorMinorPatch: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "GitVersion numeric release identity: $version"
  check:
    needs: version
    name: Python checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Compile Python sources
        run: python -m compileall -q Selectra scripts tests
      - name: Test matching and packaging
        run: python -m unittest discover -s tests -v
      - name: Check public metadata and documents
        run: python scripts/check_project.py
      - name: Build release ZIP and checksum
        run: python scripts/build.py --version "${{ needs.version.outputs.version }}"
      - name: Upload checked release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Selectra-package-${{ runner.os }}
          path: dist/Selectra-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish stable release from CI packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Selectra-package-*
          path: dist/ci
      - name: Verify all platform packages and calculated version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          channel=stable
          if [[ "$tag" != "v$RELEASE_VERSION" ]]; then channel=prerelease; fi
          python scripts/release_contract.py --version "$RELEASE_VERSION" --tag "$tag" \
            --channel "$channel" --manifest Selectra/Selectra.manifest \
            --archive "dist/ci/Selectra-package-Linux/Selectra-$RELEASE_VERSION.zip" \
            --archive "dist/ci/Selectra-package-macOS/Selectra-$RELEASE_VERSION.zip" \
            --archive "dist/ci/Selectra-package-Windows/Selectra-$RELEASE_VERSION.zip" \
            --notes "docs/releases/$RELEASE_VERSION.md"
      - name: Publish validated release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITVERSION_VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/publish_release.py --artifacts dist/ci
